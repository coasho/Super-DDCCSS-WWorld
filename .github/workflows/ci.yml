# Builds the headless platform (the simulation, the SDK, the Python package, hangar) with the project's toolchain and
# runs every test, including launcher and installed SDK acceptance. The viewer is not built here: it needs a GPU, and its frame rate is held on a machine with one
# (tools/validation/viewer_perf/viewer_perf.py).
#
# Written 2026-10-11; local headless entry points are verified, but this workflow has not run on GitHub.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      FSIM_PRESET: ucrt64-headless
      RUNNER_TOOL_CACHE: D:/ENV/tool-cache
      AGENT_TOOLSDIRECTORY: D:/ENV/tool-cache
      PIP_CACHE_DIR: D:/ENV/cache/pip
      TMP: D:/ENV/tmp
      TEMP: D:/ENV/tmp
      TORCH_EXTENSIONS_DIR: D:/ENV/tmp
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment directories
        shell: pwsh
        run: New-Item -ItemType Directory -Force D:/ENV/tmp, D:/ENV/tool-cache, D:/ENV/cache/pip | Out-Null

      # A CPython from python.org (the Python SDK is built against python3.dll, which MSYS2's own does not ship)
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.13"
      - name: Python packages (hangar, the tests)
        run: python -m pip install numpy scipy matplotlib pillow

      # Keep the UCRT64 installation under D:/ENV and pass its actual prefix to the launcher.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          location: D:/ENV/msys2
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-curl

      - name: Select toolchain
        shell: pwsh
        run: |
          $ucrtPrefix = '${{ steps.msys2.outputs.msys2-location }}/ucrt64'
          "FSIM_UCRT64_ROOT=$ucrtPrefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$ucrtPrefix/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Configure
        shell: pwsh
        run: .\fsim.cmd configure "-DFSIM_PYTHON_EXECUTABLE=${{ steps.python.outputs.python-path }}"

      - name: Build
        shell: pwsh
        run: .\fsim.cmd build

      - name: Test
        shell: pwsh
        run: .\fsim.cmd test -j 4 --timeout 3600

      - name: Stage enabled distributions
        shell: pwsh
        run: .\fsim.cmd dist

      # The generated files in the repository are what the tool makes (docs/hangar.md, "Built again"): every store
      # through hangar's pipeline, what each design gives the viewer's effects, and one aircraft through every stage
      # (all 35 take hours: tools/models/hangar/rebuild_all.py, on a developer's machine before a release)
      - name: hangar - built again
        shell: pwsh
        run: |
          .\fsim.cmd hangar stores
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\fsim.cmd hangar effects
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\fsim.cmd python tools/models/hangar/rebuild_all.py --jobs 1 --only c172
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git status --short -- aircraft assets/stores
          git diff --exit-code -- aircraft assets/stores

      - name: The test log, when a step failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: build/ucrt64-headless/Testing/Temporary/LastTest.log
