# Meteor, built by hangar from public data (ADR-30, MS-7e1) - written by `python -m hangar missiles meteor`
# (tools/hangar/hangar/missiles.py), one rule for every missile: edit the table there and write it again.
#
# Frame: metres, x aft from the nose's tip, y right, z up from the body's axis. The card (assets/stores/meteor.json)
# holds the published figures: length 3.65 m, diameter 0.178 m, mass 190 kg; span 0.4 m (assumed from photographs (the card has none)), tip to tip across
# opposite fins. Its surfaces fly in an X, 45 deg from the vertical, as it hangs on its launcher (assumed for all).
# Assumed from photographs, the same way for every missile: the nose's shape and length, each surface's place,
# chords and sweep, the motor's nozzle and burn, the CG. They only shape the picture until the aero stage runs.

[aircraft]
name = "meteor"
description = "Meteor (hangar build)"
category = "missile"
card = "meteor"             # its store card: the published figures this design holds

[analysis]
speed = 900.0                # m/s: the Reynolds numbers (Mach 3 at altitude) - assumed

# The body: an ogive radome 2.8 calibres long, the cylinder, a boattail over the nozzle (assumed)
[[body]]
name = "body"
kind = "fuselage"
stations = [
  { x = 0.0, w = 0.0, top = 0.0, bottom = 0.0, n = 2 },
  { x = 0.015, w = 0.0108, top = 0.0054, bottom = -0.0054, n = 2 },
  { x = 0.0399, w = 0.0281, top = 0.014, bottom = -0.014, n = 2 },
  { x = 0.0797, w = 0.0536, top = 0.0268, bottom = -0.0268, n = 2 },
  { x = 0.1396, w = 0.0871, top = 0.0436, bottom = -0.0436, n = 2 },
  { x = 0.2093, w = 0.1194, top = 0.0597, bottom = -0.0597, n = 2 },
  { x = 0.299, w = 0.1503, top = 0.0751, bottom = -0.0751, n = 2 },
  { x = 0.3987, w = 0.1711, top = 0.0855, bottom = -0.0855, n = 2 },
  { x = 0.4984, w = 0.178, top = 0.089, bottom = -0.089, n = 2 },
  { x = 3.5432, w = 0.178, top = 0.089, bottom = -0.089, n = 2 },
  { x = 3.65, w = 0.1424, top = 0.0712, bottom = -0.0712, n = 2 },
]

# The ducted rocket's two air intakes, low on either side (their place and size assumed from photographs)
[[intake]]
name = "intake"
mirror = true
lip = 0.006
duct = 0.4
stations = [
  { x = 2.05, y = 0.075, w = 0.085, top = -0.04, bottom = -0.11, n = 2.4 },
  { x = 2.3, y = 0.075, w = 0.085, top = -0.04, bottom = -0.11, n = 2.4 },
  { x = 2.85, y = 0.075, w = 0.0765, top = -0.0435, bottom = -0.1065, n = 2.4 },
  { x = 3.1, y = 0.075, w = 0.0213, top = -0.0662, bottom = -0.0837, n = 2.4 },
]

# The tail fins: all-moving about their spindles; root chord 0.3 m, tip 0.18 m, 0.111 m out from the body, their tips across the card's span (assumed from photographs)
[[surface]]
name = "tail fin upper"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [3.25, 0.061, 0.061], chord = 0.3 },
  { le = [3.37, 0.1414, 0.1414], chord = 0.18 },
]
controls = [
  { name = "tail fin upper", channel = "elevator", mix = { rudder = 1.0, aileron = 1.0 }, span = [0.0, 1.0], chord_fraction = 1.0, pivot = 0.45, limits = [-20, 20] },
]

[[surface]]
name = "tail fin lower"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [3.25, 0.061, -0.061], chord = 0.3 },
  { le = [3.37, 0.1414, -0.1414], chord = 0.18 },
]
controls = [
  { name = "tail fin lower", channel = "elevator", mix = { rudder = 1.0, aileron = 1.0 }, span = [0.0, 1.0], chord_fraction = 1.0, pivot = 0.45, limits = [-20, 20] },
]

# The rocket motor: the integrated booster, then the ducted rocket throttled (the card); its smoke assumed. Its nozzle in the boattail, its exit 80 % of the base and its burn's phases assumed
# (none published): only what a replay shows the plume with until a flight model burns it.
[motor]
exit = [3.65, 0.0, 0.0]
exit_diameter = 0.1139
throat_diameter = 0.0513
cone_length = 0.1253
smoke = "reduced"
[[motor.phase]]
duration_s = 2
thrust_kn = 25
[[motor.phase]]
duration_s = 25
thrust_kn = 3

[mass]
empty = 190                 # kg, the card, motor full
empty_cg = [1.825, 0.0, 0.0]  # assumed: half way along
gyration = [0.0171, 0.289, 0.289]  # radii of gyration over length - assumed (a slender rod's: L/sqrt(12))

[dimensions]                  # the card: the span tip to tip across opposite fins
length = 3.65
