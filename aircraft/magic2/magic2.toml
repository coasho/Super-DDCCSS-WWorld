# R.550 Magic 2, built by hangar from public data (ADR-30, MS-7e1) - written by `python -m hangar missiles magic2`
# (tools/hangar/hangar/missiles.py), one rule for every missile: edit the table there and write it again.
#
# Frame: metres, x aft from the nose's tip, y right, z up from the body's axis. The card (assets/stores/magic-2.json)
# holds the published figures: length 2.72 m, diameter 0.157 m, mass 89 kg; span 0.66 m (the card), tip to tip across
# opposite fins. Its surfaces fly in an X, 45 deg from the vertical, as it hangs on its launcher (assumed for all).
# Assumed from photographs, the same way for every missile: the nose's shape and length, each surface's place,
# chords and sweep, the motor's nozzle and burn, the CG. They only shape the picture until the aero stage runs.

[aircraft]
name = "magic2"
description = "R.550 Magic 2 (hangar build)"
category = "missile"
card = "magic-2"             # its store card: the published figures this design holds

[analysis]
speed = 900.0                # m/s: the Reynolds numbers (Mach 3 at altitude) - assumed

# The infrared seeker's glass dome (36 % of the body's radius - assumed), on its cone
[[body]]
name = "canopy seeker dome"
kind = "pod"
stations = [
  { x = 0.0, w = 0.0, top = 0.0, bottom = 0.0, n = 2 },
  { x = 0.0071, w = 0.0373, top = 0.0187, bottom = -0.0187, n = 2 },
  { x = 0.017, w = 0.052, top = 0.026, bottom = -0.026, n = 2 },
  { x = 0.0283, w = 0.0565, top = 0.0283, bottom = -0.0283, n = 2 },
  { x = 0.0396, w = 0.0565, top = 0.0283, bottom = -0.0283, n = 2 },
]

# The body: the seeker's cone, the cylinder, a boattail over the nozzle (assumed)
[[body]]
name = "body"
kind = "fuselage"
stations = [
  { x = 0.0127, w = 0.0452, top = 0.0226, bottom = -0.0226, n = 2 },
  { x = 0.0283, w = 0.0548, top = 0.0274, bottom = -0.0274, n = 2 },
  { x = 0.1146, w = 0.1142, top = 0.0571, bottom = -0.0571, n = 2 },
  { x = 0.201, w = 0.157, top = 0.0785, bottom = -0.0785, n = 2 },
  { x = 2.6258, w = 0.157, top = 0.0785, bottom = -0.0785, n = 2 },
  { x = 2.72, w = 0.1256, top = 0.0628, bottom = -0.0628, n = 2 },
]

# The canards: fixed; root chord 0.12 m, tip 0.04 m, 0.07 m out from the body (assumed from photographs)
[[surface]]
name = "canard upper"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [0.3, 0.0538, 0.0538], chord = 0.12 },
  { le = [0.38, 0.105, 0.105], chord = 0.04 },
]

[[surface]]
name = "canard lower"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [0.3, 0.0538, -0.0538], chord = 0.12 },
  { le = [0.38, 0.105, -0.105], chord = 0.04 },
]

# The canards: all-moving about their spindles; root chord 0.2 m, tip 0.05 m, 0.13 m out from the body (assumed from photographs)
[[surface]]
name = "canard upper"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [0.45, 0.0538, 0.0538], chord = 0.2 },
  { le = [0.6, 0.1474, 0.1474], chord = 0.05 },
]
controls = [
  { name = "canard upper", channel = "elevator", gain = -1.0, mix = { rudder = -1.0 }, span = [0.0, 1.0], chord_fraction = 1.0, pivot = 0.5, limits = [-20, 20] },
]

[[surface]]
name = "canard lower"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [0.45, 0.0538, -0.0538], chord = 0.2 },
  { le = [0.6, 0.1474, -0.1474], chord = 0.05 },
]
controls = [
  { name = "canard lower", channel = "elevator", gain = -1.0, mix = { rudder = -1.0 }, span = [0.0, 1.0], chord_fraction = 1.0, pivot = 0.5, limits = [-20, 20] },
]

# The tail fins: fixed; free to roll on their bearing ring, 2 turns per km flown; root chord 0.35 m, tip 0.14 m, 0.2515 m out from the body, their tips across the card's span (assumed from photographs)
[[surface]]
name = "tail fin upper"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [2.3, 0.0538, 0.0538], chord = 0.35 },
  { le = [2.51, 0.2333, 0.2333], chord = 0.14 },
]
free_rolling = { turns_per_m = 0.002 }

[[surface]]
name = "tail fin lower"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [2.3, 0.0538, -0.0538], chord = 0.35 },
  { le = [2.51, 0.2333, -0.2333], chord = 0.14 },
]
free_rolling = { turns_per_m = 0.002 }

# The rocket motor: single stage (the card); its smoke assumed. Its nozzle in the boattail, its exit 65 % of the base and its burn's phases assumed
# (none published): only what a replay shows the plume with until a flight model burns it.
[motor]
exit = [2.72, 0.0, 0.0]
exit_diameter = 0.0816
throat_diameter = 0.0367
cone_length = 0.0898
smoke = "reduced"
[[motor.phase]]
duration_s = 2
thrust_kn = 25

[mass]
empty = 89                 # kg, the card, motor full
empty_cg = [1.36, 0.0, 0.0]  # assumed: half way along
gyration = [0.0202, 0.289, 0.289]  # radii of gyration over length - assumed (a slender rod's: L/sqrt(12))

[dimensions]                  # the card: the span tip to tip across opposite fins
length = 2.72
span = 0.66
