  { x = 2.795119, w = 0.437549, top = 0.218775, bottom = -0.218775, n = 2 },
  { x = 2.871943, w = 0.334886, top = 0.167443, bottom = -0.167443, n = 2 },
  { x = 2.923275, w = 0.181239, top = 0.090619, bottom = -0.090619, n = 2 },
  { x = 2.9413, w = 0, top = 0, bottom = 0, n = 2 },
]

[mass]
empty = 213.642                 # kg, the card
