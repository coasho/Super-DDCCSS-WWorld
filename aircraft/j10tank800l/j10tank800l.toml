# 800 L external tank (J-10), a store built by hangar from its card (docs/hangar.md, Stores) - written by `python -m hangar storedesigns j10tank800l`
# (tools/hangar/hangar/storedesigns.py), one rule for every tank: edit stores.py's shape and write it again.
#
# Frame: metres, x aft from its nose, y right, z up from its axis. The card (assets/stores/j10-tank-800l.json) holds its
# figures: 4.5767 m long, 0.5721 m across, 80 kg empty (its fuel is what its station holds). Its shape is its class's, the same for every tank (assumed from
# photographs: stores.py) - it shapes the picture, the build-up's drag and where its fins act.

[aircraft]
name = "j10tank800l"
description = "800 L external tank (J-10) (hangar build)"
category = "store"
card = "j10-tank-800l"             # its store card: the published figures this design holds

[analysis]
speed = 250.0                # m/s: the Reynolds numbers of its carriage - assumed

[reference]                  # a store's: its frontal area and its diameter (its width), as its flight model's
area = 0.25706
span = 0.5721
chord = 0.5721
aero_point = [2.28835, 0.0, 0.0]

[model]
triangles = 6000             # its model's at most: a store's, drawn on every station that carries one

# Its body: a body of revolution, its radius along it its class's profile
[[body]]
name = "body"
kind = "fuselage"
stations = [
  { x = 0, w = 0.045768, top = 0.022884, bottom = -0.022884, n = 2 },
  { x = 0.183068, w = 0.257445, top = 0.128723, bottom = -0.128723, n = 2 },
  { x = 0.45767, w = 0.429075, top = 0.214538, bottom = -0.214538, n = 2 },
  { x = 0.778039, w = 0.532053, top = 0.266027, bottom = -0.266027, n = 2 },
  { x = 1.144175, w = 0.5721, top = 0.28605, bottom = -0.28605, n = 2 },
  { x = 2.974855, w = 0.5721, top = 0.28605, bottom = -0.28605, n = 2 },
  { x = 3.66136, w = 0.486285, top = 0.243143, bottom = -0.243143, n = 2 },
  { x = 4.210564, w = 0.314655, top = 0.157328, bottom = -0.157328, n = 2 },
  { x = 4.5767, w = 0.11442, top = 0.05721, bottom = -0.05721, n = 2 },
]

[mass]
empty = 80                 # kg, the card: its structure, dry
empty_cg = [2.28835, 0.0, 0.0]  # assumed: half way along
gyration = [1, 0.584077, 1.038357]  # a thin shell's, as its flight model's (assumed)

[dimensions]                  # the card
length = 4.5767
