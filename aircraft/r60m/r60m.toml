# R-60M, built by hangar from public data (ADR-30, MS-7e1) - written by `python -m hangar missiles r60m`
# (tools/hangar/hangar/missiles.py), one rule for every missile: edit the table there and write it again.
#
# Frame: metres, x aft from the nose's tip, y right, z up from the body's axis. The card (assets/stores/r-60m.json)
# holds the published figures: length 2.132 m, diameter 0.12 m, mass 45 kg; span 0.39 m (the card), tip to tip across
# opposite fins. Its surfaces fly in an X, 45 deg from the vertical, as it hangs on its launcher (assumed for all).
# Assumed from photographs, the same way for every missile: the nose's shape and length, each surface's place,
# chords and sweep, the motor's nozzle and burn, the CG. They only shape the picture until the aero stage runs.

[aircraft]
name = "r60m"
description = "R-60M (hangar build)"
category = "missile"
card = "r-60m"             # its store card: the published figures this design holds

[analysis]
speed = 900.0                # m/s: the Reynolds numbers (Mach 3 at altitude) - assumed

# The infrared seeker's glass dome (40 % of the body's radius - assumed), on its cone
[[body]]
name = "canopy seeker dome"
kind = "pod"
stations = [
  { x = 0.0, w = 0.0, top = 0.0, bottom = 0.0, n = 2 },
  { x = 0.006, w = 0.0317, top = 0.0158, bottom = -0.0158, n = 2 },
  { x = 0.0144, w = 0.0442, top = 0.0221, bottom = -0.0221, n = 2 },
  { x = 0.024, w = 0.048, top = 0.024, bottom = -0.024, n = 2 },
  { x = 0.0336, w = 0.048, top = 0.024, bottom = -0.024, n = 2 },
]

# The body: the seeker's cone, the cylinder, a boattail over the nozzle (assumed)
[[body]]
name = "body"
kind = "fuselage"
stations = [
  { x = 0.0108, w = 0.0384, top = 0.0192, bottom = -0.0192, n = 2 },
  { x = 0.024, w = 0.0466, top = 0.0233, bottom = -0.0233, n = 2 },
  { x = 0.09, w = 0.0894, top = 0.0447, bottom = -0.0447, n = 2 },
  { x = 0.156, w = 0.12, top = 0.06, bottom = -0.06, n = 2 },
  { x = 2.06, w = 0.12, top = 0.06, bottom = -0.06, n = 2 },
  { x = 2.132, w = 0.096, top = 0.048, bottom = -0.048, n = 2 },
]

# The canards: fixed; root chord 0.08 m, tip 0.03 m, 0.03 m out from the body (assumed from photographs)
[[surface]]
name = "canard upper"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [0.2, 0.0412, 0.0412], chord = 0.08 },
  { le = [0.25, 0.0636, 0.0636], chord = 0.03 },
]

[[surface]]
name = "canard lower"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [0.2, 0.0412, -0.0412], chord = 0.08 },
  { le = [0.25, 0.0636, -0.0636], chord = 0.03 },
]

# The canards: all-moving about their spindles; root chord 0.15 m, tip 0.04 m, 0.065 m out from the body (assumed from photographs)
[[surface]]
name = "canard upper"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [0.33, 0.0412, 0.0412], chord = 0.15 },
  { le = [0.44, 0.0884, 0.0884], chord = 0.04 },
]
controls = [
  { name = "canard upper", channel = "elevator", gain = -1.0, mix = { rudder = -1.0 }, span = [0.0, 1.0], chord_fraction = 1.0, pivot = 0.5, limits = [-20, 20] },
]

[[surface]]
name = "canard lower"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [0.33, 0.0412, -0.0412], chord = 0.15 },
  { le = [0.44, 0.0884, -0.0884], chord = 0.04 },
]
controls = [
  { name = "canard lower", channel = "elevator", gain = -1.0, mix = { rudder = -1.0 }, span = [0.0, 1.0], chord_fraction = 1.0, pivot = 0.5, limits = [-20, 20] },
]

# The tail fins: fixed; root chord 0.3 m, tip 0.1 m, 0.135 m out from the body, their tips across the card's span (assumed from photographs)
[[surface]]
name = "tail fin upper"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [1.75, 0.0412, 0.0412], chord = 0.3 },
  { le = [1.95, 0.1379, 0.1379], chord = 0.1 },
]

[[surface]]
name = "tail fin lower"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [1.75, 0.0412, -0.0412], chord = 0.3 },
  { le = [1.95, 0.1379, -0.1379], chord = 0.1 },
]

# The rocket motor: solid (the card); its smoke assumed. Its nozzle in the boattail, its exit 65 % of the base and its burn's phases assumed
# (none published): only what a replay shows the plume with until a flight model burns it.
[motor]
exit = [2.132, 0.0, 0.0]
exit_diameter = 0.0624
throat_diameter = 0.0281
cone_length = 0.0686
smoke = "reduced"
[[motor.phase]]
duration_s = 3
thrust_kn = 8

[mass]
empty = 45                 # kg, the card, motor full
empty_cg = [1.066, 0.0, 0.0]  # assumed: half way along
gyration = [0.0197, 0.289, 0.289]  # radii of gyration over length - assumed (a slender rod's: L/sqrt(12))

[dimensions]                  # the card: the span tip to tip across opposite fins
length = 2.132
span = 0.39
