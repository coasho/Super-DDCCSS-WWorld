# AN/ASQ-228 ATFLIR, a store built by hangar from its card (docs/hangar.md, Stores) - written by `python -m hangar storedesigns anasq228`
# (tools/hangar/hangar/storedesigns.py), one rule for every pod: edit stores.py's shape and write it again.
#
# Frame: metres, x aft from its nose, y right, z up from its axis. The card (assets/stores/an-asq-228.json) holds its
# figures: 1.8288 m long, 0.3302 m across, 190.5088 kg. Its shape is its class's, the same for every pod (assumed from
# photographs: stores.py) - it shapes the picture, the build-up's drag and where its fins act.

[aircraft]
name = "anasq228"
description = "AN/ASQ-228 ATFLIR (hangar build)"
category = "store"
card = "an-asq-228"             # its store card: the published figures this design holds

[analysis]
speed = 250.0                # m/s: the Reynolds numbers of its carriage - assumed

[reference]                  # a store's: its frontal area and its diameter (its width), as its flight model's
area = 0.085634
span = 0.3302
chord = 0.3302
aero_point = [0.9144, 0.0, 0.0]

[model]
triangles = 6000             # its model's at most: a store's, drawn on every station that carries one

[store]
wake = 0.3302                # m: its rounded tail's separated flow, a blunt base's of this diameter to its drag (stores.py)

# Its body: a body of revolution, its radius along it its class's profile
[[body]]
name = "body"
kind = "fuselage"
stations = [
  { x = 0, w = 0, top = 0, bottom = 0, n = 2 },
  { x = 0.012567, w = 0.126362, top = 0.063181, bottom = -0.063181, n = 2 },
  { x = 0.048357, w = 0.233487, top = 0.116743, bottom = -0.116743, n = 2 },
  { x = 0.101919, w = 0.305065, top = 0.152533, bottom = -0.152533, n = 2 },
  { x = 0.1651, w = 0.3302, top = 0.1651, bottom = -0.1651, n = 2 },
  { x = 1.6637, w = 0.3302, top = 0.1651, bottom = -0.1651, n = 2 },
  { x = 1.726881, w = 0.305065, top = 0.152533, bottom = -0.152533, n = 2 },
  { x = 1.780443, w = 0.233487, top = 0.116743, bottom = -0.116743, n = 2 },
  { x = 1.816233, w = 0.126362, top = 0.063181, bottom = -0.063181, n = 2 },
  { x = 1.8288, w = 0, top = 0, bottom = 0, n = 2 },
]

[mass]
empty = 190.5088                 # kg, the card
empty_cg = [0.9144, 0.0, 0.0]  # assumed: half way along
gyration = [1, 0.591298, 1.001729]  # a thin shell's, as its flight model's (assumed)

[dimensions]                  # the card
length = 1.8288
