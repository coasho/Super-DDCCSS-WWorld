# MICA EM's paint, by one rule for every missile (tools/hangar/hangar/missiles.py): light grey overall; a radar seeker's radome a lighter grey
# a yellow band on the warhead (a live round) and a brown one on the motor - the maker's colour code (MIL-STD-1168, STANAG 2953); the bands' places assumed
[paint]
scheme = "single"
colours = ["#c4c8cc"]
radome = "#d8dadc"
radome_x = 0.416
bands = [
  { x = [1.054, 1.104], colour = "#c8a020" },
  { x = [1.953, 2.003], colour = "#6b4a2b" },
]
panel_lines = 0.0
wear = 0.03
gloss = 0.3
