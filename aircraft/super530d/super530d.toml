# Super 530D, built by hangar from public data (ADR-30, MS-7e1) - written by `python -m hangar missiles super530d`
# (tools/hangar/hangar/missiles.py), one rule for every missile: edit the table there and write it again.
#
# Frame: metres, x aft from the nose's tip, y right, z up from the body's axis. The card (assets/stores/super-530d.json)
# holds the published figures: length 3.8 m, diameter 0.263 m, mass 270 kg; span 0.62 m (the card), tip to tip across
# opposite fins. Its surfaces fly in an X, 45 deg from the vertical, as it hangs on its launcher (assumed for all).
# Assumed from photographs, the same way for every missile: the nose's shape and length, each surface's place,
# chords and sweep, the motor's nozzle and burn, the CG. They only shape the picture until the aero stage runs.

[aircraft]
name = "super530d"
description = "Super 530D (hangar build)"
category = "missile"
card = "super-530d"             # its store card: the published figures this design holds

[analysis]
speed = 900.0                # m/s: the Reynolds numbers (Mach 3 at altitude) - assumed

# The body: an ogive radome 2.4 calibres long, the cylinder, a boattail over the nozzle (assumed)
[[body]]
name = "body"
kind = "fuselage"
stations = [
  { x = 0.0, w = 0.0, top = 0.0, bottom = 0.0, n = 2 },
  { x = 0.0189, w = 0.0162, top = 0.0081, bottom = -0.0081, n = 2 },
  { x = 0.0505, w = 0.0419, top = 0.021, bottom = -0.021, n = 2 },
  { x = 0.101, w = 0.0798, top = 0.0399, bottom = -0.0399, n = 2 },
  { x = 0.1767, w = 0.1295, top = 0.0648, bottom = -0.0648, n = 2 },
  { x = 0.2651, w = 0.177, top = 0.0885, bottom = -0.0885, n = 2 },
  { x = 0.3787, w = 0.2224, top = 0.1112, bottom = -0.1112, n = 2 },
  { x = 0.505, w = 0.2529, top = 0.1265, bottom = -0.1265, n = 2 },
  { x = 0.6312, w = 0.263, top = 0.1315, bottom = -0.1315, n = 2 },
  { x = 3.6422, w = 0.263, top = 0.1315, bottom = -0.1315, n = 2 },
  { x = 3.8, w = 0.2104, top = 0.1052, bottom = -0.1052, n = 2 },
]

# The wings: fixed; root chord 0.95 m, tip 0.35 m, 0.1785 m out from the body, their tips across the card's span (assumed from photographs)
[[surface]]
name = "wing upper"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [1.7, 0.0902, 0.0902], chord = 0.95 },
  { le = [2.3, 0.2192, 0.2192], chord = 0.35 },
]

[[surface]]
name = "wing lower"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [1.7, 0.0902, -0.0902], chord = 0.95 },
  { le = [2.3, 0.2192, -0.2192], chord = 0.35 },
]

# The tail fins: all-moving about their spindles; root chord 0.4 m, tip 0.2 m, 0.17 m out from the body (assumed from photographs)
[[surface]]
name = "tail fin upper"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [3.22, 0.0902, 0.0902], chord = 0.4 },
  { le = [3.42, 0.2132, 0.2132], chord = 0.2 },
]
controls = [
  { name = "tail fin upper", channel = "elevator", mix = { rudder = 1.0, aileron = 1.0 }, span = [0.0, 1.0], chord_fraction = 1.0, pivot = 0.45, limits = [-20, 20] },
]

[[surface]]
name = "tail fin lower"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [3.22, 0.0902, -0.0902], chord = 0.4 },
  { le = [3.42, 0.2132, -0.2132], chord = 0.2 },
]
controls = [
  { name = "tail fin lower", channel = "elevator", mix = { rudder = 1.0, aileron = 1.0 }, span = [0.0, 1.0], chord_fraction = 1.0, pivot = 0.45, limits = [-20, 20] },
]

# The rocket motor: boost-sustain assumed; aluminised assumed from its trail in photographs. Its nozzle in the boattail, its exit 65 % of the base and its burn's phases assumed
# (none published): only what a replay shows the plume with until a flight model burns it.
[motor]
exit = [3.8, 0.0, 0.0]
exit_diameter = 0.1368
throat_diameter = 0.0615
cone_length = 0.1504
smoke = "aluminised"
[[motor.phase]]
duration_s = 2
thrust_kn = 40
[[motor.phase]]
duration_s = 4
thrust_kn = 8

[mass]
empty = 270                 # kg, the card, motor full
empty_cg = [1.9, 0.0, 0.0]  # assumed: half way along
gyration = [0.0242, 0.289, 0.289]  # radii of gyration over length - assumed (a slender rod's: L/sqrt(12))

[dimensions]                  # the card: the span tip to tip across opposite fins
length = 3.8
span = 0.62
