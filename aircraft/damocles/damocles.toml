# Damocles, a store built by hangar from its card (docs/hangar.md, Stores) - written by `python -m hangar storedesigns damocles`
# (tools/hangar/hangar/storedesigns.py), one rule for every pod: edit stores.py's shape and write it again.
#
# Frame: metres, x aft from its nose, y right, z up from its axis. The card (assets/stores/damocles.json) holds its
# figures: 2.5 m long, 0.37 m across, 265 kg. Its shape is its class's, the same for every pod (assumed from
# photographs: stores.py) - it shapes the picture, the build-up's drag and where its fins act.

[aircraft]
name = "damocles"
description = "Damocles (hangar build)"
category = "store"
card = "damocles"             # its store card: the published figures this design holds

[analysis]
speed = 250.0                # m/s: the Reynolds numbers of its carriage - assumed

[reference]                  # a store's: its frontal area and its diameter (its width), as its flight model's
area = 0.107521
span = 0.37
chord = 0.37
aero_point = [1.25, 0.0, 0.0]

[model]
triangles = 6000             # its model's at most: a store's, drawn on every station that carries one

[store]
wake = 0.37                # m: its rounded tail's separated flow, a blunt base's of this diameter to its drag (stores.py)

# Its body: a body of revolution, its radius along it its class's profile
[[body]]
name = "body"
kind = "fuselage"
stations = [
  { x = 0, w = 0, top = 0, bottom = 0, n = 2 },
  { x = 0.014082, w = 0.141593, top = 0.070796, bottom = -0.070796, n = 2 },
  { x = 0.054185, w = 0.26163, top = 0.130815, bottom = -0.130815, n = 2 },
  { x = 0.114204, w = 0.341835, top = 0.170918, bottom = -0.170918, n = 2 },
  { x = 0.185, w = 0.37, top = 0.185, bottom = -0.185, n = 2 },
  { x = 2.315, w = 0.37, top = 0.185, bottom = -0.185, n = 2 },
  { x = 2.385796, w = 0.341835, top = 0.170918, bottom = -0.170918, n = 2 },
  { x = 2.445815, w = 0.26163, top = 0.130815, bottom = -0.130815, n = 2 },
  { x = 2.485918, w = 0.141593, top = 0.070796, bottom = -0.070796, n = 2 },
  { x = 2.5, w = 0, top = 0, bottom = 0, n = 2 },
]

[mass]
empty = 265                 # kg, the card
empty_cg = [1.25, 0.0, 0.0]  # assumed: half way along
gyration = [1, 0.586758, 1.022227]  # a thin shell's, as its flight model's (assumed)

[dimensions]                  # the card
length = 2.5
