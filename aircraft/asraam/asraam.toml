# AIM-132 ASRAAM, built by hangar from public data (ADR-30, MS-7e1) - written by `python -m hangar missiles asraam`
# (tools/hangar/hangar/missiles.py), one rule for every missile: edit the table there and write it again.
#
# Frame: metres, x aft from the nose's tip, y right, z up from the body's axis. The card (assets/stores/asraam.json)
# holds the published figures: length 2.9 m, diameter 0.166 m, mass 88 kg; span 0.45 m (the card), tip to tip across
# opposite fins. Its surfaces fly in an X, 45 deg from the vertical, as it hangs on its launcher (assumed for all).
# Assumed from photographs, the same way for every missile: the nose's shape and length, each surface's place,
# chords and sweep, the motor's nozzle and burn, the CG. They only shape the picture until the aero stage runs.

[aircraft]
name = "asraam"
description = "AIM-132 ASRAAM (hangar build)"
category = "missile"
card = "asraam"             # its store card: the published figures this design holds

[analysis]
speed = 900.0                # m/s: the Reynolds numbers (Mach 3 at altitude) - assumed

# The infrared seeker's glass dome (40 % of the body's radius - assumed), on its cone
[[body]]
name = "canopy seeker dome"
kind = "pod"
stations = [
  { x = 0.0, w = 0.0, top = 0.0, bottom = 0.0, n = 2 },
  { x = 0.0083, w = 0.0438, top = 0.0219, bottom = -0.0219, n = 2 },
  { x = 0.0199, w = 0.0611, top = 0.0305, bottom = -0.0305, n = 2 },
  { x = 0.0332, w = 0.0664, top = 0.0332, bottom = -0.0332, n = 2 },
  { x = 0.0465, w = 0.0664, top = 0.0332, bottom = -0.0332, n = 2 },
]

# The body: the seeker's cone, the cylinder, a boattail over the nozzle (assumed)
[[body]]
name = "body"
kind = "fuselage"
stations = [
  { x = 0.0149, w = 0.0531, top = 0.0266, bottom = -0.0266, n = 2 },
  { x = 0.0332, w = 0.0644, top = 0.0322, bottom = -0.0322, n = 2 },
  { x = 0.1245, w = 0.1236, top = 0.0618, bottom = -0.0618, n = 2 },
  { x = 0.2158, w = 0.166, top = 0.083, bottom = -0.083, n = 2 },
  { x = 2.8004, w = 0.166, top = 0.083, bottom = -0.083, n = 2 },
  { x = 2.9, w = 0.1328, top = 0.0664, bottom = -0.0664, n = 2 },
]

# The tail fins: all-moving about their spindles; root chord 0.3 m, tip 0.15 m, 0.142 m out from the body, their tips across the card's span (assumed from photographs)
[[surface]]
name = "tail fin upper"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [2.55, 0.0569, 0.0569], chord = 0.3 },
  { le = [2.7, 0.1591, 0.1591], chord = 0.15 },
]
controls = [
  { name = "tail fin upper", channel = "elevator", mix = { rudder = 1.0, aileron = 1.0 }, span = [0.0, 1.0], chord_fraction = 1.0, pivot = 0.45, limits = [-20, 20] },
]

[[surface]]
name = "tail fin lower"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [2.55, 0.0569, -0.0569], chord = 0.3 },
  { le = [2.7, 0.1591, -0.1591], chord = 0.15 },
]
controls = [
  { name = "tail fin lower", channel = "elevator", mix = { rudder = 1.0, aileron = 1.0 }, span = [0.0, 1.0], chord_fraction = 1.0, pivot = 0.45, limits = [-20, 20] },
]

# The rocket motor: dual burn (the card); low smoke assumed. Its nozzle in the boattail, its exit 65 % of the base and its burn's phases assumed
# (none published): only what a replay shows the plume with until a flight model burns it.
[motor]
exit = [2.9, 0.0, 0.0]
exit_diameter = 0.0863
throat_diameter = 0.0388
cone_length = 0.095
smoke = "reduced"
[[motor.phase]]
duration_s = 2
thrust_kn = 25
[[motor.phase]]
duration_s = 4
thrust_kn = 6

[mass]
empty = 88                 # kg, the card, motor full
empty_cg = [1.45, 0.0, 0.0]  # assumed: half way along
gyration = [0.02, 0.289, 0.289]  # radii of gyration over length - assumed (a slender rod's: L/sqrt(12))

[dimensions]                  # the card: the span tip to tip across opposite fins
length = 2.9
span = 0.45
