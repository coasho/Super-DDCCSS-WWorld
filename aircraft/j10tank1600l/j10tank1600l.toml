# 1,600 L external tank (J-10), a store built by hangar from its card (docs/hangar.md, Stores) - written by `python -m hangar storedesigns j10tank1600l`
# (tools/hangar/hangar/storedesigns.py), one rule for every tank: edit stores.py's shape and write it again.
#
# Frame: metres, x aft from its nose, y right, z up from its axis. The card (assets/stores/j10-tank-1600l.json) holds its
# figures: 5.7663 m long, 0.7208 m across, 160 kg empty (its fuel is what its station holds). Its shape is its class's, the same for every tank (assumed from
# photographs: stores.py) - it shapes the picture, the build-up's drag and where its fins act.

[aircraft]
name = "j10tank1600l"
description = "1,600 L external tank (J-10) (hangar build)"
category = "store"
card = "j10-tank-1600l"             # its store card: the published figures this design holds

[analysis]
speed = 250.0                # m/s: the Reynolds numbers of its carriage - assumed

[reference]                  # a store's: its frontal area and its diameter (its width), as its flight model's
area = 0.408056
span = 0.7208
chord = 0.7208
aero_point = [2.88315, 0.0, 0.0]

[model]
triangles = 6000             # its model's at most: a store's, drawn on every station that carries one

# Its body: a body of revolution, its radius along it its class's profile
[[body]]
name = "body"
kind = "fuselage"
stations = [
  { x = 0, w = 0.057664, top = 0.028832, bottom = -0.028832, n = 2 },
  { x = 0.230652, w = 0.32436, top = 0.16218, bottom = -0.16218, n = 2 },
  { x = 0.57663, w = 0.5406, top = 0.2703, bottom = -0.2703, n = 2 },
  { x = 0.980271, w = 0.670344, top = 0.335172, bottom = -0.335172, n = 2 },
  { x = 1.441575, w = 0.7208, top = 0.3604, bottom = -0.3604, n = 2 },
  { x = 3.748095, w = 0.7208, top = 0.3604, bottom = -0.3604, n = 2 },
  { x = 4.61304, w = 0.61268, top = 0.30634, bottom = -0.30634, n = 2 },
  { x = 5.304996, w = 0.39644, top = 0.19822, bottom = -0.19822, n = 2 },
  { x = 5.7663, w = 0.14416, top = 0.07208, bottom = -0.07208, n = 2 },
]

[mass]
empty = 160                 # kg, the card: its structure, dry
empty_cg = [2.88315, 0.0, 0.0]  # assumed: half way along
gyration = [1, 0.584077, 1.038357]  # a thin shell's, as its flight model's (assumed)

[dimensions]                  # the card
length = 5.7663
