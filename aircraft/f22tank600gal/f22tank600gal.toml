# 600 US gal external tank (F-22), a store built by hangar from its card (docs/hangar.md, Stores) - written by `python -m hangar storedesigns f22tank600gal`
# (tools/hangar/hangar/storedesigns.py), one rule for every tank: edit stores.py's shape and write it again.
#
# Frame: metres, x aft from its nose, y right, z up from its axis. The card (assets/stores/f22-tank-600gal.json) holds its
# figures: 6.4806 m long, 0.8101 m across, 227.1247 kg empty (its fuel is what its station holds). Its shape is its class's, the same for every tank (assumed from
# photographs: stores.py) - it shapes the picture, the build-up's drag and where its fins act.

[aircraft]
name = "f22tank600gal"
description = "600 US gal external tank (F-22) (hangar build)"
category = "store"
card = "f22-tank-600gal"             # its store card: the published figures this design holds

[analysis]
speed = 250.0                # m/s: the Reynolds numbers of its carriage - assumed

[reference]                  # a store's: its frontal area and its diameter (its width), as its flight model's
area = 0.515427
span = 0.8101
chord = 0.8101
aero_point = [3.2403, 0.0, 0.0]

[model]
triangles = 6000             # its model's at most: a store's, drawn on every station that carries one

# Its body: a body of revolution, its radius along it its class's profile
[[body]]
name = "body"
kind = "fuselage"
stations = [
  { x = 0, w = 0.064808, top = 0.032404, bottom = -0.032404, n = 2 },
  { x = 0.259224, w = 0.364545, top = 0.182273, bottom = -0.182273, n = 2 },
  { x = 0.64806, w = 0.607575, top = 0.303787, bottom = -0.303787, n = 2 },
  { x = 1.101702, w = 0.753393, top = 0.376697, bottom = -0.376697, n = 2 },
  { x = 1.62015, w = 0.8101, top = 0.40505, bottom = -0.40505, n = 2 },
  { x = 4.21239, w = 0.8101, top = 0.40505, bottom = -0.40505, n = 2 },
  { x = 5.18448, w = 0.688585, top = 0.344293, bottom = -0.344293, n = 2 },
  { x = 5.962152, w = 0.445555, top = 0.222778, bottom = -0.222778, n = 2 },
  { x = 6.4806, w = 0.16202, top = 0.08101, bottom = -0.08101, n = 2 },
]

[mass]
empty = 227.1247                 # kg, the card: its structure, dry
empty_cg = [3.2403, 0.0, 0.0]  # assumed: half way along
gyration = [1, 0.584077, 1.038356]  # a thin shell's, as its flight model's (assumed)

[dimensions]                  # the card
length = 6.4806
