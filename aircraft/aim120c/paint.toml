# AIM-120C-7 AMRAAM's paint, by one rule for every missile (tools/hangar/hangar/missiles.py): light grey overall; a radar seeker's radome a lighter grey
# a yellow band on the warhead (a live round) and a brown one on the motor - the maker's colour code (MIL-STD-1168, STANAG 2953); the bands' places assumed
[paint]
scheme = "single"
colours = ["#c4c8cc"]
radome = "#d8dadc"
radome_x = 0.4623
bands = [
  { x = [1.2444, 1.2944], colour = "#c8a020" },
  { x = [2.3058, 2.3558], colour = "#6b4a2b" },
]
panel_lines = 0.0
wear = 0.03
gloss = 0.3
