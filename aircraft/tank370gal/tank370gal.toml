# 370 US gal external tank (F-16), a store built by hangar from its card (docs/hangar.md, Stores) - written by `python -m hangar storedesigns tank370gal`
# (tools/hangar/hangar/storedesigns.py), one rule for every tank: edit stores.py's shape and write it again.
#
# Frame: metres, x aft from its nose, y right, z up from its axis. The card (assets/stores/tank-370gal.json) holds its
# figures: 5.563 m long, 0.673 m across, 201 kg empty (its fuel is what its station holds). Its shape is its class's, the same for every tank (assumed from
# photographs: stores.py) - it shapes the picture, the build-up's drag and where its fins act.

[aircraft]
name = "tank370gal"
description = "370 US gal external tank (F-16) (hangar build)"
category = "store"
card = "tank-370gal"             # its store card: the published figures this design holds

[analysis]
speed = 250.0                # m/s: the Reynolds numbers of its carriage - assumed

[reference]                  # a store's: its frontal area and its diameter (its width), as its flight model's
area = 0.35573
span = 0.673
chord = 0.673
aero_point = [2.7815, 0.0, 0.0]

[model]
triangles = 6000             # its model's at most: a store's, drawn on every station that carries one

# Its body: a body of revolution, its radius along it its class's profile
[[body]]
name = "body"
kind = "fuselage"
stations = [
  { x = 0, w = 0.05384, top = 0.02692, bottom = -0.02692, n = 2 },
  { x = 0.22252, w = 0.30285, top = 0.151425, bottom = -0.151425, n = 2 },
  { x = 0.5563, w = 0.50475, top = 0.252375, bottom = -0.252375, n = 2 },
  { x = 0.94571, w = 0.62589, top = 0.312945, bottom = -0.312945, n = 2 },
  { x = 1.39075, w = 0.673, top = 0.3365, bottom = -0.3365, n = 2 },
  { x = 3.61595, w = 0.673, top = 0.3365, bottom = -0.3365, n = 2 },
  { x = 4.4504, w = 0.57205, top = 0.286025, bottom = -0.286025, n = 2 },
  { x = 5.11796, w = 0.37015, top = 0.185075, bottom = -0.185075, n = 2 },
  { x = 5.563, w = 0.1346, top = 0.0673, bottom = -0.0673, n = 2 },
]

[mass]
empty = 201                 # kg, the card: its structure, dry
empty_cg = [2.7815, 0.0, 0.0]  # assumed: half way along
gyration = [1, 0.583653, 1.041329]  # a thin shell's, as its flight model's (assumed)

[dimensions]                  # the card
length = 5.563
