# RPL-701, a store built by hangar from its card (docs/hangar.md, Stores) - written by `python -m hangar storedesigns rpl701`
# (tools/hangar/hangar/storedesigns.py), one rule for every tank: edit stores.py's shape and write it again.
#
# Frame: metres, x aft from its nose, y right, z up from its axis. The card (assets/stores/rpl-701.json) holds its
# figures: 5.3108 m long, 0.6639 m across, 125 kg empty (its fuel is what its station holds). Its shape is its class's, the same for every tank (assumed from
# photographs: stores.py) - it shapes the picture, the build-up's drag and where its fins act.

[aircraft]
name = "rpl701"
description = "RPL-701 (hangar build)"
category = "store"
card = "rpl-701"             # its store card: the published figures this design holds

[analysis]
speed = 250.0                # m/s: the Reynolds numbers of its carriage - assumed

[reference]                  # a store's: its frontal area and its diameter (its width), as its flight model's
area = 0.346175
span = 0.6639
chord = 0.6639
aero_point = [2.6554, 0.0, 0.0]

[model]
triangles = 6000             # its model's at most: a store's, drawn on every station that carries one

# Its body: a body of revolution, its radius along it its class's profile
[[body]]
name = "body"
kind = "fuselage"
stations = [
  { x = 0, w = 0.053112, top = 0.026556, bottom = -0.026556, n = 2 },
  { x = 0.212432, w = 0.298755, top = 0.149378, bottom = -0.149378, n = 2 },
  { x = 0.53108, w = 0.497925, top = 0.248963, bottom = -0.248963, n = 2 },
  { x = 0.902836, w = 0.617427, top = 0.308714, bottom = -0.308714, n = 2 },
  { x = 1.3277, w = 0.6639, top = 0.33195, bottom = -0.33195, n = 2 },
  { x = 3.45202, w = 0.6639, top = 0.33195, bottom = -0.33195, n = 2 },
  { x = 4.24864, w = 0.564315, top = 0.282158, bottom = -0.282158, n = 2 },
  { x = 4.885936, w = 0.365145, top = 0.182573, bottom = -0.182573, n = 2 },
  { x = 5.3108, w = 0.13278, top = 0.06639, bottom = -0.06639, n = 2 },
]

[mass]
empty = 125                 # kg, the card: its structure, dry
empty_cg = [2.6554, 0.0, 0.0]  # assumed: half way along
gyration = [1, 0.584078, 1.038352]  # a thin shell's, as its flight model's (assumed)

[dimensions]                  # the card
length = 5.3108
