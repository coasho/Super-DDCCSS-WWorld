# AN/ALQ-131(V), a store built by hangar from its card (docs/hangar.md, Stores) - written by `python -m hangar storedesigns analq131`
# (tools/hangar/hangar/storedesigns.py), one rule for every pod: edit stores.py's shape and write it again.
#
# Frame: metres, x aft from its nose, y right, z up from its axis. The card (assets/stores/an-alq-131.json) holds its
# figures: 2.798 m long, 0.4864 m across, 299.2 kg. Its shape is its class's, the same for every pod (assumed from
# photographs: stores.py) - it shapes the picture, the build-up's drag and where its fins act.

[aircraft]
name = "analq131"
description = "AN/ALQ-131(V) (hangar build)"
category = "store"
card = "an-alq-131"             # its store card: the published figures this design holds

[analysis]
speed = 250.0                # m/s: the Reynolds numbers of its carriage - assumed

[reference]                  # a store's: its frontal area and its diameter (its width), as its flight model's
area = 0.185813
span = 0.4864
chord = 0.4864
aero_point = [1.399, 0.0, 0.0]

[model]
triangles = 6000             # its model's at most: a store's, drawn on every station that carries one

[store]
wake = 0.4864                # m: its rounded tail's separated flow, a blunt base's of this diameter to its drag (stores.py)

# Its body: a body of revolution, its radius along it its class's profile
[[body]]
name = "body"
kind = "fuselage"
stations = [
  { x = 0, w = 0, top = 0, bottom = 0, n = 2 },
  { x = 0.018512, w = 0.186137, top = 0.093069, bottom = -0.093069, n = 2 },
  { x = 0.071232, w = 0.343937, top = 0.171968, bottom = -0.171968, n = 2 },
  { x = 0.150131, w = 0.449375, top = 0.224688, bottom = -0.224688, n = 2 },
  { x = 0.2432, w = 0.4864, top = 0.2432, bottom = -0.2432, n = 2 },
  { x = 2.5548, w = 0.4864, top = 0.2432, bottom = -0.2432, n = 2 },
  { x = 2.647869, w = 0.449375, top = 0.224688, bottom = -0.224688, n = 2 },
  { x = 2.726768, w = 0.343937, top = 0.171968, bottom = -0.171968, n = 2 },
  { x = 2.779488, w = 0.186137, top = 0.093069, bottom = -0.093069, n = 2 },
  { x = 2.798, w = 0, top = 0, bottom = 0, n = 2 },
]

[mass]
empty = 299.2                 # kg, the card
empty_cg = [1.399, 0.0, 0.0]  # assumed: half way along
gyration = [1, 0.590291, 1.005745]  # a thin shell's, as its flight model's (assumed)

[dimensions]                  # the card
length = 2.798
