# PL-12, built by hangar from public data (ADR-30, MS-7e1) - written by `python -m hangar missiles pl12`
# (tools/hangar/hangar/missiles.py), one rule for every missile: edit the table there and write it again.
#
# Frame: metres, x aft from the nose's tip, y right, z up from the body's axis. The card (assets/stores/pl-12.json)
# holds the published figures: length 3.93 m, diameter 0.203 m, mass 180 kg; span 0.67 m (the card), tip to tip across
# opposite fins. Its surfaces fly in an X, 45 deg from the vertical, as it hangs on its launcher (assumed for all).
# Assumed from photographs, the same way for every missile: the nose's shape and length, each surface's place,
# chords and sweep, the motor's nozzle and burn, the CG. They only shape the picture until the aero stage runs.

[aircraft]
name = "pl12"
description = "PL-12 (hangar build)"
category = "missile"
card = "pl-12"             # its store card: the published figures this design holds

[analysis]
speed = 900.0                # m/s: the Reynolds numbers (Mach 3 at altitude) - assumed

# The body: an ogive radome 2.6 calibres long, the cylinder, a boattail over the nozzle (assumed)
[[body]]
name = "body"
kind = "fuselage"
stations = [
  { x = 0.0, w = 0.0, top = 0.0, bottom = 0.0, n = 2 },
  { x = 0.0158, w = 0.0124, top = 0.0062, bottom = -0.0062, n = 2 },
  { x = 0.0422, w = 0.0322, top = 0.0161, bottom = -0.0161, n = 2 },
  { x = 0.0844, w = 0.0613, top = 0.0307, bottom = -0.0307, n = 2 },
  { x = 0.1478, w = 0.0996, top = 0.0498, bottom = -0.0498, n = 2 },
  { x = 0.2217, w = 0.1364, top = 0.0682, bottom = -0.0682, n = 2 },
  { x = 0.3167, w = 0.1715, top = 0.0858, bottom = -0.0858, n = 2 },
  { x = 0.4222, w = 0.1952, top = 0.0976, bottom = -0.0976, n = 2 },
  { x = 0.5278, w = 0.203, top = 0.1015, bottom = -0.1015, n = 2 },
  { x = 3.8082, w = 0.203, top = 0.1015, bottom = -0.1015, n = 2 },
  { x = 3.93, w = 0.1624, top = 0.0812, bottom = -0.0812, n = 2 },
]

# The wings: fixed; root chord 0.45 m, tip 0.12 m, 0.2335 m out from the body, their tips across the card's span (assumed from photographs)
[[surface]]
name = "wing upper"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [1.7, 0.0696, 0.0696], chord = 0.45 },
  { le = [2.03, 0.2369, 0.2369], chord = 0.12 },
]

[[surface]]
name = "wing lower"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [1.7, 0.0696, -0.0696], chord = 0.45 },
  { le = [2.03, 0.2369, -0.2369], chord = 0.12 },
]

# The tail fins: all-moving about their spindles; root chord 0.34 m, tip 0.15 m, 0.2335 m out from the body, their tips across the card's span (assumed from photographs)
[[surface]]
name = "tail fin upper"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [3.5, 0.0696, 0.0696], chord = 0.34 },
  { le = [3.69, 0.2369, 0.2369], chord = 0.15 },
]
controls = [
  { name = "tail fin upper", channel = "elevator", mix = { rudder = 1.0, aileron = 1.0 }, span = [0.0, 1.0], chord_fraction = 1.0, pivot = 0.45, limits = [-20, 20] },
]

[[surface]]
name = "tail fin lower"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [3.5, 0.0696, -0.0696], chord = 0.34 },
  { le = [3.69, 0.2369, -0.2369], chord = 0.15 },
]
controls = [
  { name = "tail fin lower", channel = "elevator", mix = { rudder = 1.0, aileron = 1.0 }, span = [0.0, 1.0], chord_fraction = 1.0, pivot = 0.45, limits = [-20, 20] },
]

# The rocket motor: dual thrust (the card); its smoke assumed. Its nozzle in the boattail, its exit 65 % of the base and its burn's phases assumed
# (none published): only what a replay shows the plume with until a flight model burns it.
[motor]
exit = [3.93, 0.0, 0.0]
exit_diameter = 0.1056
throat_diameter = 0.0475
cone_length = 0.1161
smoke = "reduced"
[[motor.phase]]
duration_s = 3
thrust_kn = 25
[[motor.phase]]
duration_s = 6
thrust_kn = 6

[mass]
empty = 180                 # kg, the card, motor full
empty_cg = [1.965, 0.0, 0.0]  # assumed: half way along
gyration = [0.0181, 0.289, 0.289]  # radii of gyration over length - assumed (a slender rod's: L/sqrt(12))

[dimensions]                  # the card: the span tip to tip across opposite fins
length = 3.93
span = 0.67
