# R-37M, built by hangar from public data (ADR-30, MS-7e1) - written by `python -m hangar missiles r37m`
# (tools/hangar/hangar/missiles.py), one rule for every missile: edit the table there and write it again.
#
# Frame: metres, x aft from the nose's tip, y right, z up from the body's axis. The card (assets/stores/r-37m.json)
# holds the published figures: length 4.06 m, diameter 0.38 m, mass 510 kg; span 0.72 m (the card), tip to tip across
# opposite fins. Its surfaces fly in an X, 45 deg from the vertical, as it hangs on its launcher (assumed for all).
# Assumed from photographs, the same way for every missile: the nose's shape and length, each surface's place,
# chords and sweep, the motor's nozzle and burn, the CG. They only shape the picture until the aero stage runs.

[aircraft]
name = "r37m"
description = "R-37M (hangar build)"
category = "missile"
card = "r-37m"             # its store card: the published figures this design holds

[analysis]
max_mach = 5.0 # Retains the former store table Mach domain.
speed = 900.0                # m/s: the Reynolds numbers (Mach 3 at altitude) - assumed

# The body: an ogive radome 3.6 calibres long, the cylinder, a boattail over the nozzle (assumed)
[[body]]
name = "body"
kind = "fuselage"
stations = [
  { x = 0.0, w = 0.0, top = 0.0, bottom = 0.0, n = 2 },
  { x = 0.041, w = 0.0229, top = 0.0114, bottom = -0.0114, n = 2 },
  { x = 0.1094, w = 0.0593, top = 0.0297, bottom = -0.0297, n = 2 },
  { x = 0.2189, w = 0.1134, top = 0.0567, bottom = -0.0567, n = 2 },
  { x = 0.383, w = 0.1848, top = 0.0924, bottom = -0.0924, n = 2 },
  { x = 0.5746, w = 0.2538, top = 0.1269, bottom = -0.1269, n = 2 },
  { x = 0.8208, w = 0.3202, top = 0.1601, bottom = -0.1601, n = 2 },
  { x = 1.0944, w = 0.3651, top = 0.1825, bottom = -0.1825, n = 2 },
  { x = 1.368, w = 0.38, top = 0.19, bottom = -0.19, n = 2 },
  { x = 3.832, w = 0.38, top = 0.19, bottom = -0.19, n = 2 },
  { x = 4.06, w = 0.304, top = 0.152, bottom = -0.152, n = 2 },
]

# The strakes: fixed; root chord 1.7 m, tip 1.6 m, 0.03 m out from the body (assumed from photographs)
[[surface]]
name = "strake upper"
kind = "fin"
mirror = true
airfoil = "plate"
sections = [
  { le = [1.55, 0.1303, 0.1303], chord = 1.7 },
  { le = [1.65, 0.1556, 0.1556], chord = 1.6 },
]

[[surface]]
name = "strake lower"
kind = "fin"
mirror = true
airfoil = "plate"
sections = [
  { le = [1.55, 0.1303, -0.1303], chord = 1.7 },
  { le = [1.65, 0.1556, -0.1556], chord = 1.6 },
]

# The tail fins: all-moving about their spindles; root chord 0.58 m, tip 0.28 m, 0.17 m out from the body, their tips across the card's span (assumed from photographs)
[[surface]]
name = "tail fin upper"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [3.4, 0.1303, 0.1303], chord = 0.58 },
  { le = [3.7, 0.2546, 0.2546], chord = 0.28 },
]
controls = [
  { name = "tail fin upper", channel = "elevator", mix = { rudder = 1.0, aileron = 1.0 }, span = [0.0, 1.0], chord_fraction = 1.0, pivot = 0.45, limits = [-26, 26] },
]

[[surface]]
name = "tail fin lower"
kind = "fin"
mirror = true
airfoil = "biconvex4"
sections = [
  { le = [3.4, 0.1303, -0.1303], chord = 0.58 },
  { le = [3.7, 0.2546, -0.2546], chord = 0.28 },
]
controls = [
  { name = "tail fin lower", channel = "elevator", mix = { rudder = 1.0, aileron = 1.0 }, span = [0.0, 1.0], chord_fraction = 1.0, pivot = 0.45, limits = [-26, 26] },
]

# The rocket motor: dual pulse (the card); aluminised composite assumed. Its nozzle in the boattail, its exit 65 % of the base and its burn's phases assumed
# (none published): only what a replay shows the plume with until a flight model burns it.
[motor]
exit = [4.06, 0.0, 0.0]
exit_diameter = 0.1976
throat_diameter = 0.0889
cone_length = 0.2174
smoke = "aluminised"
[[motor.phase]]
duration_s = 7
thrust_kn = 74
[[motor.phase]]
duration_s = 18
thrust_kn = 0.0
[[motor.phase]]
duration_s = 11.5
thrust_kn = 23

[mass]
empty = 510                 # kg, the card, motor full
empty_cg = [2.1112, 0.0, 0.0]  # assumed: 52 % along
gyration_reference = "body-length-v1"
gyration = [0.0328, 0.289, 0.289]  # radii of gyration over length - assumed (a slender rod's: L/sqrt(12))

[dimensions]                  # the card: the span tip to tip across opposite fins
length = 4.06
span = 0.72

# Derived normalization only; this does not add a physical wing.
[reference]
area = 0.11341149479459153
span = 0.38
chord = 0.38
aero_point = [2.1112, 0.0, 0.0]

# Shared source-derived fixed resolution; no equipment-specific timestep.
[integration]
version = 2
mode = "derived"
