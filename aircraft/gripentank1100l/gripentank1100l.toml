# 1,100 L external tank (Gripen), a store built by hangar from its card (docs/hangar.md, Stores) - written by `python -m hangar storedesigns gripentank1100l`
# (tools/hangar/hangar/storedesigns.py), one rule for every tank: edit stores.py's shape and write it again.
#
# Frame: metres, x aft from its nose, y right, z up from its axis. The card (assets/stores/gripen-tank-1100l.json) holds its
# figures: 5.0893 m long, 0.6362 m across, 110 kg empty (its fuel is what its station holds). Its shape is its class's, the same for every tank (assumed from
# photographs: stores.py) - it shapes the picture, the build-up's drag and where its fins act.

[aircraft]
name = "gripentank1100l"
description = "1,100 L external tank (Gripen) (hangar build)"
category = "store"
card = "gripen-tank-1100l"             # its store card: the published figures this design holds

[analysis]
speed = 250.0                # m/s: the Reynolds numbers of its carriage - assumed

[reference]                  # a store's: its frontal area and its diameter (its width), as its flight model's
area = 0.31789
span = 0.6362
chord = 0.6362
aero_point = [2.54465, 0.0, 0.0]

[model]
triangles = 6000             # its model's at most: a store's, drawn on every station that carries one

# Its body: a body of revolution, its radius along it its class's profile
[[body]]
name = "body"
kind = "fuselage"
stations = [
  { x = 0, w = 0.050896, top = 0.025448, bottom = -0.025448, n = 2 },
  { x = 0.203572, w = 0.28629, top = 0.143145, bottom = -0.143145, n = 2 },
  { x = 0.50893, w = 0.47715, top = 0.238575, bottom = -0.238575, n = 2 },
  { x = 0.865181, w = 0.591666, top = 0.295833, bottom = -0.295833, n = 2 },
  { x = 1.272325, w = 0.6362, top = 0.3181, bottom = -0.3181, n = 2 },
  { x = 3.308045, w = 0.6362, top = 0.3181, bottom = -0.3181, n = 2 },
  { x = 4.07144, w = 0.54077, top = 0.270385, bottom = -0.270385, n = 2 },
  { x = 4.682156, w = 0.34991, top = 0.174955, bottom = -0.174955, n = 2 },
  { x = 5.0893, w = 0.12724, top = 0.06362, bottom = -0.06362, n = 2 },
]

[mass]
empty = 110                 # kg, the card: its structure, dry
empty_cg = [2.54465, 0.0, 0.0]  # assumed: half way along
gyration = [1, 0.584078, 1.038354]  # a thin shell's, as its flight model's (assumed)

[dimensions]                  # the card
length = 5.0893
