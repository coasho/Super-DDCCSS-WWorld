# Project cruise configuration v1, generated by the common aircraft/store pipeline.
# Body dimensions/launch mass retain the existing card. Wing, fuel split, engine,
# inertia and controller sizing below are explicit engineering estimates, not
# exact-variant measurements. The historical CJ-10A / air-launch identity caveat
# remains in the source card. This source is the virtual configuration truth.
# Frame: metres, x aft from nose, y right, z up. No generated XML is a source.

[aircraft]
name = "cj10a"
description = "CJ-10A (hangar build)"
category = "missile"
card = "cj-10a"             # its store card: the published figures this design holds

[analysis]
max_mach = 5.0 # Retains the former store table Mach domain.
speed = 250.0                # m/s: the Reynolds numbers of its carriage - assumed

[reference]                  # a store's: its frontal area and its diameter (its width), as its flight model's
area = 3.6
span = 6.0
chord = 0.65
aero_point = [2.88, 0.0, 0.0]

[model]
triangles = 10000             # its model's at most: a store's, drawn on every station that carries one

# Its body: a body of revolution, its radius along it its class's profile
[[body]]
name = "body"
kind = "fuselage"
stations = [
  { x = 0, w = 0, top = 0, bottom = 0, n = 2 },
  { x = 0.15, w = 0.225, top = 0.1125, bottom = -0.1125, n = 2 },
  { x = 0.4, w = 0.465, top = 0.2325, bottom = -0.2325, n = 2 },
  { x = 0.75, w = 0.66, top = 0.33, bottom = -0.33, n = 2 },
  { x = 1.1, w = 0.75, top = 0.375, bottom = -0.375, n = 2 },
  { x = 5.4, w = 0.75, top = 0.375, bottom = -0.375, n = 2 },
  { x = 5.9, w = 0.675, top = 0.3375, bottom = -0.3375, n = 2 },
  { x = 6.4, w = 0.465, top = 0.2325, bottom = -0.2325, n = 2 },
]

# Fixed lifting wing: virtual sizing at 200 m/s, not an equipment outline claim.
[[surface]]
name = "cruise wing"
kind = "wing"
mirror = true
airfoil = "naca0012"
sections = [
  { le = [2.45, 0.3, 0.0], chord = 0.8 },
  { le = [2.65, 3.0, 0.0], chord = 0.4 },
]

# Four independently mixed finite tail controls, with explicit mechanical stops.
[[surface]]
name = "fin 1"
kind = "fin"
mirror = true
airfoil = "plate"
sections = [
  { le = [5.45, 0.237773, 0.237773], chord = 0.75 },
  { le = [5.709808, 0.560824, 0.560824], chord = 0.4 },
]
controls = [
  { name = "upper tail control", channel = "elevator", mix = { rudder = 1.0, aileron = 1.0 }, span = [0.0, 1.0], chord_fraction = 1.0, pivot = 0.45, limits = [-20, 20] },
]

[[surface]]
name = "fin 2"
kind = "fin"
mirror = true
airfoil = "plate"
sections = [
  { le = [5.45, 0.237773, -0.237773], chord = 0.75 },
  { le = [5.709808, 0.560824, -0.560824], chord = 0.4 },
]
controls = [
  { name = "lower tail control", channel = "elevator", mix = { rudder = 1.0, aileron = 1.0 }, span = [0.0, 1.0], chord_fraction = 1.0, pivot = 0.45, limits = [-20, 20] },
]

[[engine]]
name = "estimated cruise turbofan v1"
type = "turbofan"
position = [5.4, 0.0, 0.0]
mass = 200.0
thrust_dry_kn = 6.0
bypass_ratio = 1.0
tsfc_dry = 0.8
design_mach = 0.65
[engine.nozzle]
position = [6.4, 0.0, 0.0]

[store_propulsion]
version = 1
cruise_speed_ms = 200.0
governor_time_s = 5.0

[mass]
empty = 1200.0               # kg: explicit dry/fuel split, including the warhead
empty_cg = [2.7, 0.0, 0.0]
gyration = [0.08, 0.28, 0.29] # radii / body length; engineering mass distribution
[[mass.tank]]
name = "cruise fuel"
capacity = 600.0
fill = 1.0
position = [3.2, 0.0, 0.0]

[dimensions]                  # the card
length = 6.4

# Shared source-derived fixed resolution; no equipment-specific timestep.
[integration]
version = 2
mode = "derived"
