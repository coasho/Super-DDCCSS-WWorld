# R-77M's paint, by one rule for every missile (tools/hangar/hangar/missiles.py): light grey overall; a radar seeker's radome a lighter grey
# no bands: no published colour code for its maker's munitions was found
[paint]
scheme = "single"
colours = ["#c4c8cc"]
radome = "#d8dadc"
radome_x = 0.52
panel_lines = 0.0
wear = 0.03
gloss = 0.3
