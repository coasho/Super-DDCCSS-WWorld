# R-77M, built by hangar from public data (ADR-30, MS-7e1) - written by `python -m hangar missiles r77m`
# (tools/hangar/hangar/missiles.py), one rule for every missile: edit the table there and write it again.
#
# Frame: metres, x aft from the nose's tip, y right, z up from the body's axis. The card (assets/stores/r-77m.json)
# holds the published figures: length 3.71 m, diameter 0.2 m, mass 190 kg; span 0.6 m (assumed from photographs (the card has none)), tip to tip across
# opposite fins. Its surfaces fly in an X, 45 deg from the vertical, as it hangs on its launcher (assumed for all).
# Assumed from photographs, the same way for every missile: the nose's shape and length, each surface's place,
# chords and sweep, the motor's nozzle and burn, the CG. They only shape the picture until the aero stage runs.

[aircraft]
name = "r77m"
description = "R-77M (hangar build)"
category = "missile"
card = "r-77m"             # its store card: the published figures this design holds

[analysis]
speed = 900.0                # m/s: the Reynolds numbers (Mach 3 at altitude) - assumed

[model]
cell_m = 0.0015               # the mesher's cell: its lattice fins' walls a few of them thick

# The body: an ogive radome 2.6 calibres long, the cylinder, a boattail over the nozzle (assumed)
[[body]]
name = "body"
kind = "fuselage"
stations = [
  { x = 0.0, w = 0.0, top = 0.0, bottom = 0.0, n = 2 },
  { x = 0.0156, w = 0.0122, top = 0.0061, bottom = -0.0061, n = 2 },
  { x = 0.0416, w = 0.0317, top = 0.0159, bottom = -0.0159, n = 2 },
  { x = 0.0832, w = 0.0604, top = 0.0302, bottom = -0.0302, n = 2 },
  { x = 0.1456, w = 0.0982, top = 0.0491, bottom = -0.0491, n = 2 },
  { x = 0.2184, w = 0.1344, top = 0.0672, bottom = -0.0672, n = 2 },
  { x = 0.312, w = 0.169, top = 0.0845, bottom = -0.0845, n = 2 },
  { x = 0.416, w = 0.1923, top = 0.0961, bottom = -0.0961, n = 2 },
  { x = 0.52, w = 0.2, top = 0.1, bottom = -0.1, n = 2 },
  { x = 3.59, w = 0.2, top = 0.1, bottom = -0.1, n = 2 },
  { x = 3.71, w = 0.16, top = 0.08, bottom = -0.08, n = 2 },
]

# The strakes: fixed; root chord 1.2 m, tip 1.1 m, 0.05 m out from the body (assumed from photographs)
[[surface]]
name = "strake upper"
kind = "fin"
mirror = true
airfoil = "plate"
sections = [
  { le = [1.5, 0.0686, 0.0686], chord = 1.2 },
  { le = [1.6, 0.1061, 0.1061], chord = 1.1 },
]

[[surface]]
name = "strake lower"
kind = "fin"
mirror = true
airfoil = "plate"
sections = [
  { le = [1.5, 0.0686, -0.0686], chord = 1.2 },
  { le = [1.6, 0.1061, -0.1061], chord = 1.1 },
]

# The tail fins: lattice (grid) fins, all-moving, 0.15 m wide, 3 cells across; root chord 0.12 m, tip 0.12 m, 0.2 m out from the body, their tips across the card's span (assumed from photographs)
[[surface]]
name = "tail fin upper"
kind = "fin"
mirror = true
airfoil = "plate"
sections = [
  { le = [3.5, 0.0686, 0.0686], chord = 0.12 },
  { le = [3.5, 0.2121, 0.2121], chord = 0.12 },
]
lattice = { width = 0.15, cells = 3 }
controls = [
  { name = "tail fin upper", channel = "elevator", mix = { rudder = 1.0, aileron = 1.0 }, span = [0.0, 1.0], chord_fraction = 1.0, pivot = 0.45, limits = [-20, 20] },
]

[[surface]]
name = "tail fin lower"
kind = "fin"
mirror = true
airfoil = "plate"
sections = [
  { le = [3.5, 0.0686, -0.0686], chord = 0.12 },
  { le = [3.5, 0.2121, -0.2121], chord = 0.12 },
]
lattice = { width = 0.15, cells = 3 }
controls = [
  { name = "tail fin lower", channel = "elevator", mix = { rudder = 1.0, aileron = 1.0 }, span = [0.0, 1.0], chord_fraction = 1.0, pivot = 0.45, limits = [-20, 20] },
]

# The rocket motor: dual pulse (the card); its smoke assumed. Its nozzle in the boattail, its exit 65 % of the base and its burn's phases assumed
# (none published): only what a replay shows the plume with until a flight model burns it.
[motor]
exit = [3.71, 0.0, 0.0]
exit_diameter = 0.104
throat_diameter = 0.0468
cone_length = 0.1144
smoke = "reduced"
[[motor.phase]]
duration_s = 4
thrust_kn = 25
[[motor.phase]]
duration_s = 6
thrust_kn = 0.0
[[motor.phase]]
duration_s = 4
thrust_kn = 12

[mass]
empty = 190                 # kg, the card, motor full
empty_cg = [1.855, 0.0, 0.0]  # assumed: half way along
gyration = [0.0189, 0.289, 0.289]  # radii of gyration over length - assumed (a slender rod's: L/sqrt(12))

[dimensions]                  # the card: the span tip to tip across opposite fins
length = 3.71
