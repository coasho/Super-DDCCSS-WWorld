# 610 US gal external tank (F-15), a store built by hangar from its card (docs/hangar.md, Stores) - written by `python -m hangar storedesigns tank610gal`
# (tools/hangar/hangar/storedesigns.py), one rule for every tank: edit stores.py's shape and write it again.
#
# Frame: metres, x aft from its nose, y right, z up from its axis. The card (assets/stores/tank-610gal.json) holds its
# figures: 6.5164 m long, 0.8146 m across, 230.9101 kg empty (its fuel is what its station holds). Its shape is its class's, the same for every tank (assumed from
# photographs: stores.py) - it shapes the picture, the build-up's drag and where its fins act.

[aircraft]
name = "tank610gal"
description = "610 US gal external tank (F-15) (hangar build)"
category = "store"
card = "tank-610gal"             # its store card: the published figures this design holds

[analysis]
speed = 250.0                # m/s: the Reynolds numbers of its carriage - assumed

[reference]                  # a store's: its frontal area and its diameter (its width), as its flight model's
area = 0.521169
span = 0.8146
chord = 0.8146
aero_point = [3.2582, 0.0, 0.0]

[model]
triangles = 6000             # its model's at most: a store's, drawn on every station that carries one

# Its body: a body of revolution, its radius along it its class's profile
[[body]]
name = "body"
kind = "fuselage"
stations = [
  { x = 0, w = 0.065168, top = 0.032584, bottom = -0.032584, n = 2 },
  { x = 0.260656, w = 0.36657, top = 0.183285, bottom = -0.183285, n = 2 },
  { x = 0.65164, w = 0.61095, top = 0.305475, bottom = -0.305475, n = 2 },
  { x = 1.107788, w = 0.757578, top = 0.378789, bottom = -0.378789, n = 2 },
  { x = 1.6291, w = 0.8146, top = 0.4073, bottom = -0.4073, n = 2 },
  { x = 4.23566, w = 0.8146, top = 0.4073, bottom = -0.4073, n = 2 },
  { x = 5.21312, w = 0.69241, top = 0.346205, bottom = -0.346205, n = 2 },
  { x = 5.995088, w = 0.44803, top = 0.224015, bottom = -0.224015, n = 2 },
  { x = 6.5164, w = 0.16292, top = 0.08146, bottom = -0.08146, n = 2 },
]

[mass]
empty = 230.9101                 # kg, the card: its structure, dry
empty_cg = [3.2582, 0.0, 0.0]  # assumed: half way along
gyration = [1, 0.584078, 1.038353]  # a thin shell's, as its flight model's (assumed)

[dimensions]                  # the card
length = 6.5164
