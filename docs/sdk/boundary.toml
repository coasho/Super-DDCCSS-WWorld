# The SDK's principals (ADR-31, docs/agent-boundary.md; AB-1): every entry point, classified.
#
# tools/boundary/boundary.py reads the surface from the DLLs' export tables and the Python package, and matches it here.
# A rule names its entry points exactly (`names`) or by pattern (`globs`, fnmatch, the first rule matching wins); an
# exact name always wins over a pattern. Names: C++ qualified without parameters (`fsim::Vehicle::submit`), C as
# exported (`fsim_vehicle_submit`), Python by the defining module (`fsim.world.Vehicle.submit`).
#
# principal:
#   agent     an agent (MA's decisions) may call it, on its own platform
#   ma_core   the MA core alone, applying A-GRA's rules (the range stands in for C2 until AB-5)
#   range     the experiment's author: building and changing the world
#   referee   read only, truth among it: scoring, rewards, a critic
#   platform  inside the simulated equipment: the control runtime, plug-ins and their interfaces
#   value     no world: names, struct initialisers, unit and physics helpers, the SDK's version
# leaks: what an agent's call reaches today that ADR-31 keeps from agents (the register below); AB-2 closes them.

[explicit]
# Role-mixing scopes: every entry point here is classified by its name, never by a pattern, so a new call on these
# objects fails the check until someone decides whose it is.
scopes = [
    "fsim::Vehicle::", "fsim::World::", "fsim::comm::Network::", "fsim::vision::Sensors::",
    "fsim::vision::BatchCameras::",
    "fsim::Agent::", "fsim::Referee::", "fsim.agent.",
    "fsim_vehicle_", "fsim_world_", "fsim_activity_", "fsim_comm_", "fsim_ms_", "fsim_strike", "fsim_vision_",
    "fsim_last_command_",
    "fsim.world.Vehicle.", "fsim.world.World.", "fsim.world.Activity.", "fsim.vision.",
]

[leak]
L1 = "Returns the World or the Vehicle: whoever holds an agent-facing object reaches every range call - closed for agents by AB-2a: an agent holds its own objects and handle, which refuse it"
L2 = "Identity declared by the caller: a Source or a ControllerId it chooses (a policy may claim Override) - closed for agents by AB-2a: an agent holds its own objects and handle, which refuse it"
L3 = "Truth labels in a report: a detection's or a track's `truth`, the entity behind it - closed for agents by AB-2a: an agent holds its own objects and handle, which refuse it"
L4 = "Another aircraft named by entity id - a strike's, a behaviour's or a must-fly point's target, a frame following a vehicle - and flown on its true state - closed for agents by AB-2a: an agent holds its own objects and handle, which refuse it; it names its own designations - targets by track, flown on their estimates (AB-2b)"
L5 = "Own ship as a whole VehicleState: sensor effects applied, but with fields no platform reports (crashed, diverged, step count) - closed for agents by AB-2a: an agent holds its own objects and handle, which refuse it"
L6 = "Messages: the sender is the caller's to set, and any node's inbox is readable - closed for agents by AB-2a: an agent holds its own objects and handle, which refuse it; by AB-4a its messages go through its system's DMS, named by SystemID - no entity id in what it sends or receives"
L11 = "World-global mission data: operational points, zones, lines, volumes and frames one agent writes are every agent's - closed by AB-2c: each MA's own, or the range's common, by owner"

