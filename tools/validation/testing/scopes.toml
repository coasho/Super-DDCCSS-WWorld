# Change-scoped test selection (docs/development.md, "Change-scoped testing"; tools/validation/testing/scope.py).
#
# Each [[scope]] maps changed paths (`paths`, glob patterns from the repository root; `**` crosses directories) to the
# CTest tests that cover them: `labels` (every test carrying one of them, less any in `exclude_labels`) and `tests`
# (regular expressions over whole test names; `{stem}` is the changed file's name without its extension). With
# --tier integration, `integration` (names) and `integration_labels` (whole labels, none excluded) are added. Tests
# labelled `stress` (long contention cases) are selected in the targeted tier only when a matched scope names that
# label, or they are built from or import the change - never through a broader pattern. Beyond the rules here,
# scope.py itself selects every CTest test built from a changed C/C++ test source or whose command names the changed
# file, and every python_sdk test whose module imports the changed Python file - through other modules, shared test
# fixtures and the scripts it runs (the import closure of tests/compatibility/python and python/fsim).
#
#   release = true   the same selection also runs on ucrt64-release (render, vision, viewer and public-surface changes)
#   render_only = true  (with release) the paths are built only with the renderer: they plan ucrt64-release alone, as
#                    the headless build does not compile them; another scope claiming a path keeps ucrt64-headless too
#   A `release` scope whose labels include "render" (render-only or shared) needs renderer coverage: its ucrt64-release
#   plan selects every `render`-labelled test and is an error (no-renderer-coverage) on an inventory without one, which
#   its generic names cannot satisfy. Headless keeps a shared scope's own selection.
#   full = true      escalate to the full suite of each preset the changed path plans by itself: shared simulation
#                    core, build system, data every test flies. Another path's preset is not escalated by it (HC-19):
#                    with a renderer change beside it, ucrt64-release runs that change's own selection
#   build = false    no native build is needed before running (documentation, repository checks)
#   except = [...]   paths this scope does not claim, though its `paths` match them (a more specific scope does)
#   claims = false   the scope adds its tests to what claims a path, but claims none itself: a path only it matches is
#                    still unclaimed (the Python package's export check, beside the import closure that must cover it)
#   [scope.requires] <preset> = [...]   tests (regular expressions over whole names) the preset must have: each
#                    preset the scope plans selects them, whatever the tier, and a plan on an inventory missing any one
#                    is an error (missing-required-tests) - the scope's other tests are no stand-in for them
#
# A changed path nothing claims escalates to the full suite when it is native source or build input, and is an error
# otherwise (scope.py exits 3 naming it): add a scope here when a domain gets its own targeted coverage; keep it
# reviewed. A selection that comes out empty is an error too. Whatever claims it, a path the presets' compile databases
# show is compiled only in ucrt64-release (or lies in a directory whose sources are) plans ucrt64-release: a renderer
# change never passes on the headless build, which does not compile it. testing_scope_checker holds the render-only
# scope below to those databases: every source compiled only with the renderer is claimed by it.

# --- documentation and repository checks ------------------------------------------------------------------------------
[[scope]]
name = "documentation"
paths = ["docs/**", "*.md", "**/*.md"]
tests = ["^ma_contract$", "^architecture_boundary$", "^sdk_guard_checker$"]
build = false

# (each preset's own configured graph is reconciled with the source graph - architecture_configured - so both run it.
# A nonempty architecture label is no evidence that the gates ran: each preset must have them (HC-40))
[[scope]]
name = "architecture checker"
paths = ["tools/architecture/**", "cmake/ArchitectureChecks.cmake"]
labels = ["architecture"]
build = false
release = true
[scope.requires]
ucrt64-headless = ["^architecture_boundary$", "^architecture_checker$", "^architecture_configured$", "^architecture_configured_checker$"]
ucrt64-release = ["^architecture_boundary$", "^architecture_checker$", "^architecture_configured$", "^architecture_configured_checker$"]

[[scope]]
name = "SDK principals"
paths = ["tools/validation/boundary/**", "docs/sdk/boundary.toml", "docs/sdk/boundary.md"]
tests = ["^sdk_boundary$", "^sdk_guard_checker$"]
release = true

[[scope]]
name = "test selection"
paths = ["tools/validation/testing/**"]
tests = ["^testing_scope_checker$"]
build = false

[[scope]]
name = "missile flight and aerodynamic reference safeguards"
paths = ["tools/validation/missile/**"]
except = ["tools/validation/missile/native/OpenVspIntersectionFixture.cmake"]
tests = ["^missile_flight_reference_checker$", "^missile_aero_reference_checker$"]
build = false

# This file is included only by an explicit external OpenVSP geometry/API build.
# Its repository guards do not compile that external project or configure the SDK.
[[scope]]
name = "external OpenVSP intersection fixture"
paths = ["tools/validation/missile/native/OpenVspIntersectionFixture.cmake"]
tests = ["^missile_aero_reference_checker$"]
build = false
[scope.requires]
ucrt64-headless = ["^missile_aero_reference_checker$"]

# --- MA training (docs/sdk/mission-training.md) -----------------------------------------------------------------------
# Targeted: the build-tree tests over the changed code. Integration: also the installed consumers and the domain's whole
# labels - stress (contention) and package cases among them - before a package's handoff.
[[scope]]
name = "MA contract"
paths = ["tools/validation/ma_contract/check.py", "tools/validation/ma_contract/test_check.py", "docs/sdk/ma-contract.schema.json",
         "docs/sdk/ma-training.schema.json", "docs/sdk/mission-training.md"]
tests = ["^ma_contract$", "^ma_contract_checker$"]
build = false

[[scope]]
name = "MA compatibility comparison"
paths = ["tools/validation/ma_contract/baseline.py", "tools/validation/ma_contract/test_baseline.py"]
tests = ["^ma_baseline_checker$"]

[[scope]]
name = "MA contract fixtures"
paths = ["tests/training/fixtures/mission_training/contract/**", "tests/training/MissionTestSupport.h"]
tests = ["^ma_contract$", "^ma_actions$", "^ma_observation$", "^mission_training$", "^mission_c_abi$", "^python_sdk test_mission"]
integration_labels = ["ma-training"]

[[scope]]
name = "MA joint chains"
paths = ["tools/validation/ma_contract/joint_chain.py", "tests/training/fixtures/mission_training/joint/**"]
tests = ["^ma_joint$", "^python_sdk test_ma_joint$"]
integration = ["^mission_package_consumer$"]

[[scope]]
name = "MA installed consumers"
paths = ["tests/compatibility/mission_package_consumer/**", "cmake/RunMissionPackageConsumer.cmake"]
tests = ["^mission_package_consumer$"]

[[scope]]
name = "MA gateway (native)"
paths = ["src/training/native/mission/**", "src/training/native/batch/**", "src/training/native/episodes/api/**",
         "src/adapters/sdk/c/fsim_mission_env_c.cpp"]
tests = ["^ma_actions$", "^ma_observation$", "^mission_training$", "^mission_c_abi$", "^ma_joint$", "^python_sdk test_(mission|ma_joint)",
         "^c_abi$", "^sdk_boundary$"]
integration = ["^mission_package_consumer$", "^ma_baseline_checker$"]
integration_labels = ["ma-training"]

[[scope]]
name = "MA episode owner (native)"
paths = ["src/training/native/episodes/runtime/MissionEpisode.*"]
tests = ["^mission_episode$", "^native_state_reset_fixture$", "^simulation_interface_boundary$", "^ma_actions$", "^mission_training$",
         "^ma_joint$", "^python_sdk test_mission$"]
integration = ["^mission_package_consumer$"]
integration_labels = ["ma-training"]

[[scope]]
name = "MA concurrency"
paths = ["src/training/native/batch/MissionBatch.cpp", "src/training/native/episodes/api/MissionEpisode.cpp",
         "src/training/native/episodes/api/MissionEpisodeImpl.h",
         "src/training/native/episodes/runtime/MissionEpisode.*",
         "src/adapters/sdk/python/_native_mission_env.c", "python/fsim/training.py", "python/fsim/_training/**",
         "include/fsim/MissionBatch.h"]
labels = ["stress"]

[[scope]]
name = "MA public surface"
paths = ["include/fsim/Mission*.h", "include/fsim/fsim_mission_env.h", "include/fsim/MAService.h", "include/fsim/MAReports.h"]
tests = ["^ma_actions$", "^ma_observation$", "^mission_training$", "^mission_c_abi$", "^ma_joint$", "^python_sdk test_(mission|ma_)",
         "^c_abi$", "^sdk_boundary$", "^ma_baseline_checker$", "^mission_package_consumer$"]
integration_labels = ["ma-training"]
release = true

[[scope]]
name = "MA Python package"
paths = ["python/fsim/mission.py", "python/fsim/training.py", "python/fsim/_training/**", "python/fsim/isolation.py",
         "python/fsim/_adapters/**", "src/adapters/sdk/python/_native_mission_env.c"]
tests = ["^python_sdk test_(mission|ma_|isolation)", "^sdk_boundary$"]
integration = ["^mission_package_consumer$"]
integration_labels = ["ma-training"]

[[scope]]
name = "MA composition example"
paths = ["examples/training/ma_composition/**"]
tests = ["^python_sdk test_ma_composition$", "^python_sdk test_mission_training$"]
integration = ["^mission_package_consumer$"]
build = false

[[scope]]
name = "testbench"
paths = ["src/applications/testbench/fsim_testbench/**", "Testbench.cmd"]
tests = ["^python_sdk test_testbench_entry$"]
build = false

# --- the Python SDK (its tests follow the import closure; see above) ----------------------------------------------------
[[scope]]
name = "Python SDK package"
paths = ["python/fsim/**", "tests/compatibility/python/**"]
tests = ["^sdk_boundary$"]  # (the package's exports, each with its principal)
claims = false

# --- other domains with their own targeted coverage -------------------------------------------------------------------
[[scope]]
name = "hangar"
paths = ["tools/models/hangar/**"]
labels = ["hangar"]
build = false

[[scope]]
name = "launchers"
paths = ["fsim.cmd", "tools/launch/**", "tests/compatibility/test_launchers.ps1"]
labels = ["launcher"]

[[scope]]
name = "installed SDK package"
paths = ["tests/compatibility/package_consumer/**", "tests/compatibility/equipment_package_consumer/**",
         "cmake/RunPackageConsumer.cmake", "cmake/RunEquipmentPackageConsumer.cmake",
         "cmake/PackageConfig.cmake", "cmake/CleanDist.cmake", "cmake/TestDistComponents.cmake"]
labels = ["package"]

# The demo publisher (flightsim-demo, ARCH-08) and the control block the viewer drives it through. Its process tests use
# the viewer's client and run where the viewer is built - they are required there (HC-31); both presets build the
# publisher and require its single-step schedules, its include view and the control block's contract test.
[[scope]]
name = "demo publisher"
paths = ["src/applications/demo/**", "src/contracts/world_stream/DemoControl.h", "tests/integration/test_demo_steps.cpp"]
tests = ["^demo_publisher", "^include_view_demo$", "^contracts$"]
release = true
[scope.requires]
ucrt64-release = ["^demo_publisher$", "^demo_publisher_steps$", "^demo_publisher_lifecycle$", "^demo_publisher_schedules$",
                  "^include_view_demo$", "^contracts$"]
ucrt64-headless = ["^demo_publisher_schedules$", "^include_view_demo$", "^contracts$"]

[[scope]]
name = "render, vision and viewer"
paths = ["include/fsim/fsim_vision_c.h", "python/fsim/vision.py", "python/fsim/_visualization/**", "assets/**"]
labels = ["render"]
tests = ["^sdk_boundary$", "vision", "camera", "rcs"]
release = true

# What is built only with the renderer (FSIM_WITH_RENDER): visualization (render, scene, visual effects, the Flow solver,
# UI, offscreen vision) with its nested CMake files, the Vision adapter and its Python extension, the viewer, the
# renderer's tools, example and tests. A change to any of it is compiled and tested on ucrt64-release alone - its
# tests carry the `render` label - and ucrt64-headless is not planned for it (it does not compile it).
[[scope]]
name = "render-only roots"
paths = ["src/visualization/**", "src/adapters/vision/**", "src/applications/viewer/**",
         "tools/models/rcs/**", "tools/validation/flow_calibrate/**", "examples/visualization/vision_capture/**", "tests/visualization/test_terrain_render.cpp",
         "tests/visualization/test_vehicle_visuals.cpp", "tests/visualization/test_cocip.cpp", "tests/visualization/test_contrail_observed.cpp", "tests/visualization/test_gpu_timer.cpp",
         "tests/visualization/test_viewer_screenshot.cpp", "tests/visualization/test_vision.cpp", "tests/visualization/test_vision_c_abi.c",
         "tests/integration/test_demo_publisher.cpp", "cmake/Flow.cmake"]
labels = ["render"]
tests = ["^sdk_boundary$", "vision", "camera"]
release = true
render_only = true

# --- escalate: what every test depends on -------------------------------------------------------------------------------
# Shared build inputs configure both presets, the renderer's branches included, so they plan and escalate both (HC-20):
# planning a full suite never authorizes running it (HC-11). That is every CMake declaration both configures read, at
# its real depth (HC-39): each module's under src, the examples' and tools' - but not what only the renderer's branch
# configures, which the render-only roots route to ucrt64-release alone, nor the test and package scripts and consumer
# projects that their own scopes claim.
[[scope]]
name = "build system"
paths = ["CMakeLists.txt", "CMakePresets.json", "cmake/**", "deps/**", "third_party/**", "src/**/CMakeLists.txt",
         "examples/**/CMakeLists.txt", "tools/**/CMakeLists.txt", "tests/CMakeLists.txt", "python/CMakeLists.txt"]
except = ["cmake/RunMissionPackageConsumer.cmake", "cmake/ArchitectureChecks.cmake", "cmake/RunPackageConsumer.cmake",
          "cmake/RunEquipmentPackageConsumer.cmake", "cmake/PackageConfig.cmake", "cmake/CleanDist.cmake", "cmake/TestDistComponents.cmake",
          "src/visualization/**", "src/adapters/vision/**", "src/applications/viewer/**", "examples/visualization/vision_capture/**",
          "tools/models/rcs/**", "tools/validation/flow_calibrate/**"]
full = true
release = true

[[scope]]
name = "shared simulation core"
paths = ["src/foundation/core/**", "src/simulation/flight/**", "src/simulation/runtime/**",
         "src/simulation/flight_control/**", "src/foundation/io/**", "src/simulation/communications/network/**",
         "src/simulation/communications/dms/**", "include/fsim/World.h", "include/fsim/Agent.h",
         "include/fsim/Capability.h", "include/fsim/fsim_c.h", "aircraft/**", "src/simulation/api/**",
         "src/adapters/sdk/cpp/VecEnv.cpp", "src/adapters/sdk/c/fsim_c.cpp", "src/training/native/vecenv/**"]
# (the legacy environment - VecEnv, tasks, observations, the registry - is linked into libfsim and run by native, C,
# Python and plugin tests alike; the mission episode owner beside it, in training/native/episodes/runtime, has its own
# scope)
full = true
